services:
  dbaui:
    build: .
    image: dbaui:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DBAUI_PORT:-8080}:8080"
    volumes:
      - dbaui-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

volumes:
  dbaui-data:
